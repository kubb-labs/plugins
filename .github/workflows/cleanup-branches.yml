name: Cleanup Merged Branches

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  delete-branch:
    # GitHub deletes merged branches. A bot PR from pr.yml targets the source PR's branch,
    # so GitHub closes it unmerged once that branch merges or closes, and keeps its branch.
    if: startsWith(github.event.pull_request.head.ref, 'chore/update-generated-examples-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete bot branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              console.log(`Deleted branch: ${branch}`);
            } catch (e) {
              console.log(`Branch ${branch} already deleted or protected`);
            }
