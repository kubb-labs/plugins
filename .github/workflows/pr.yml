name: PR

on:
  workflow_dispatch:
  # A pull request that touches only these paths cannot change what we build, so
  # the whole workflow is skipped. autofix.ci has no filter and still formats and
  # lints every pull request.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - 'assets/**'
      - 'LICENSE'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Jobs that publish something read this instead of running for every change.
  changes:
    name: Detect changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            packages:
              - 'packages/**'
              - 'internals/**'
              - 'configs/**'
              - 'pnpm-lock.yaml'

  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@da8a350ddbedb4dd9cf54b05b7ef1a4298c4f0dc # main
        with:
          node-version: '22.22.3'

      - name: Build
        run: pnpm build

  typecheck:
    name: Typecheck
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.actor != 'github-actions[bot]'
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@da8a350ddbedb4dd9cf54b05b7ef1a4298c4f0dc # main
        with:
          node-version: '22.22.3'

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck examples
        run: pnpm typecheck:examples

  tests:
    name: Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.actor != 'github-actions[bot]'
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@da8a350ddbedb4dd9cf54b05b7ef1a4298c4f0dc # main
        with:
          node-version: '22.22.3'

      - name: Test
        run: pnpm run test --coverage

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  linting:
    name: Linting
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@da8a350ddbedb4dd9cf54b05b7ef1a4298c4f0dc # main
        with:
          node-version: '22.22.3'

      - name: Linting
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: pnpm run lint

  benchmarks:
    name: Performance benchmarks (Vitest)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.actor != 'github-actions[bot]'
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@da8a350ddbedb4dd9cf54b05b7ef1a4298c4f0dc # main
        with:
          node-version: '22.22.3'

      - name: Build
        run: pnpm build

      - name: Run Vitest benchmarks
        run: pnpm run test:bench

  prerelease:
    name: Prerelease
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # pkg-pr-new publishes real preview packages, so it only runs when a package changed.
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.packages == 'true'
    needs: [build, changes]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@da8a350ddbedb4dd9cf54b05b7ef1a4298c4f0dc # main
        with:
          node-version: '22.22.3'

      - name: Build
        run: pnpm run build

      - name: Publish preview packages
        run: pnpx pkg-pr-new publish --pnpm --owner=stijnvanhulle --repo=https://github.com/kubb-labs/plugins.git './packages/*' --template './examples/*'

  dependency-diff:
    name: Dependency Diff
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Analyze dependency changes
        uses: e18e/action-dependency-diff@5d3c6ac2ad2de2eaca1dc120c5accfd9590764b6 # v1
        continue-on-error: true
        with:
          duplicate-threshold: 5
          size-threshold: -1

  compressed-size:
    name: Compressed size
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.actor != 'github-actions[bot]' && github.event_name == 'pull_request'
    needs: build
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@da8a350ddbedb4dd9cf54b05b7ef1a4298c4f0dc # main
        with:
          node-version: '22.22.3'

      - name: Report compressed bundle size
        uses: preactjs/compressed-size-action@66325aad6443cb7cf89c4bfcd414aea2367cda94 # v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          build-script: 'build'
          pattern: './packages/*/dist/**/*.{js,mjs,cjs}'

  # This job automatically updates generated example files when package code changes
  # It creates a new PR targeting the source branch with the generated updates
  update-examples:
    name: Update generated examples
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && needs.changes.outputs.packages == 'true'
    needs: [build, changes]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@da8a350ddbedb4dd9cf54b05b7ef1a4298c4f0dc # main
        with:
          node-version: '22.22.3'

      - name: Build
        run: pnpm run build

      - name: Generate examples
        id: generate
        run: pnpm run generate
        env:
          KUBB_DISABLE_TELEMETRY: '1'

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain examples/) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in examples/"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in examples/"
          fi

      - name: Create Pull Request with generated files
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          base: ${{ github.head_ref || github.ref_name }}
          branch: chore/update-generated-examples-${{ github.event.number }}
          delete-branch: true
          title: 'chore: update generated examples'
          commit-message: 'chore(examples): update generated files'
          body: |
            Automated update of generated example files from `pnpm generate`.

            This PR was automatically created to keep example generated files in sync.

  e2e:
    name: Build and test on ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    if: github.actor != 'github-actions[bot]'
    needs: build
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22.22.3']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Tools
        uses: kubb-labs/config/.github/setup@da8a350ddbedb4dd9cf54b05b7ef1a4298c4f0dc # main
        with:
          node-version: '22.22.3'

      - name: Build
        run: pnpm run build

      - name: Run E2E tests
        working-directory: ./tests/e2e
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          KUBB_DISABLE_TELEMETRY: '1'
        run: |
          pnpm run generate --reporter file

  comment-ratio:
    name: Comment ratio
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.actor != 'github-actions[bot]' && github.event_name == 'pull_request'
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check comment ratio
        uses: IgnaceMaes/comment-ratio@8667d710c02c19dcca42be02f97d5f6824012932 # v1.0.0
        with:
          max-comment-ratio: 0.15
          exclude: |
            examples/**
            **/__snapshots__/**
            **/gen/**
