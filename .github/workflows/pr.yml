name: PR

on:
  workflow_dispatch:
  # Skips the whole workflow. autofix.ci is unfiltered and still formats these.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.agents/**'
      - '.claude/**'
      - 'assets/**'
      - 'LICENSE'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - &checkout
        name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            packages:
              - 'packages/**'
              - 'internals/**'
              - 'configs/**'
              - 'pnpm-lock.yaml'

  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.actor != 'github-actions[bot]'
    steps:
      - &checkout-full
        name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - &setup
        name: Setup Tools
        uses: kubb-labs/config/.github/setup@78a8e47fd83e12065225fad5d4e6610a85a3b70c # main

      - &build
        name: Build
        run: pnpm build --concurrency=3

  typecheck:
    name: Typecheck
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - *checkout-full
      - *setup
      - *build

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck examples
        run: pnpm typecheck:examples

  tests:
    name: Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - *checkout-full
      - *setup

      - name: Test
        run: pnpm run test --coverage

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  linting:
    name: Linting
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.actor != 'github-actions[bot]'
    steps:
      - *checkout
      - *setup

      - name: Linting
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: pnpm run lint

  benchmarks:
    name: Performance benchmarks (Vitest)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - *checkout
      - *setup
      - *build

      - name: Run Vitest benchmarks
        run: pnpm run test:bench

  prerelease:
    name: Prerelease
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # pkg-pr-new publishes preview packages, so gate it on a package changing.
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.packages == 'true'
    needs: [build, changes]
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - *setup
      - *build

      - name: Publish preview packages
        run: pnpx pkg-pr-new publish --pnpm --owner=stijnvanhulle --repo=https://github.com/kubb-labs/plugins.git './packages/*' --template './examples/*'

  dependency-diff:
    name: Dependency Diff
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - *checkout-full

      - name: Analyze dependency changes
        uses: e18e/action-dependency-diff@9a7f09f5f2993256322e0db17ee4c8d9339dab77 # v1
        continue-on-error: true
        with:
          duplicate-threshold: 5
          size-threshold: -1

  compressed-size:
    name: Compressed size
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.actor != 'github-actions[bot]' && github.event_name == 'pull_request'
    needs: build
    steps:
      - *checkout-full
      - *setup

      - name: Report compressed bundle size
        uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          build-script: 'build'
          pattern: './packages/*/dist/**/*.{js,mjs,cjs}'

  # This job automatically updates generated example files when package code changes
  # It creates a new PR targeting the source branch with the generated updates
  update-examples:
    name: Update generated examples
    timeout-minutes: 20
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && needs.changes.outputs.packages == 'true'
    needs: [build, changes]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - *checkout
      - *setup
      - *build

      - name: Generate examples
        run: pnpm run generate

      - name: Create Pull Request with generated files
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          base: ${{ github.head_ref || github.ref_name }}
          branch: chore/update-generated-examples-${{ github.event.number }}
          delete-branch: true
          title: 'chore: update generated examples'
          commit-message: 'chore(examples): update generated files'
          body: |
            Automated update of generated example files from `pnpm generate`.

            This PR was automatically created to keep example generated files in sync.

  e2e:
    name: Build and test on ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - *checkout
      - *setup
      - *build

      - name: Run E2E tests
        working-directory: ./tests/e2e
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          KUBB_DISABLE_TELEMETRY: '1'
        run: pnpm run generate --reporter file

      - name: Upload Kubb logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-kubb-logs-${{ matrix.os }}
          path: tests/e2e/.kubb/*.log
          if-no-files-found: ignore

  comment-ratio:
    name: Comment ratio
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.actor != 'github-actions[bot]' && github.event_name == 'pull_request'
    steps:
      - *checkout-full

      - name: Check comment ratio
        uses: IgnaceMaes/comment-ratio@8667d710c02c19dcca42be02f97d5f6824012932 # v1.0.0
        with:
          max-comment-ratio: 0.15
          exclude: |
            examples/**
            **/__snapshots__/**
            **/gen/**
