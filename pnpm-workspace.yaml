packages:
  - packages/*
  - internals/*
  - examples/*
  - tests/**

allowBuilds:
  cypress: false
  es5-ext: true
  esbuild: true
  msw: true
  vue-demi: true

catalog:
  # Ranges, not pins: these end up in the published dependencies and peerDependencies of every
  # plugin, and a pin there conflicts with any newer Kubb release the user installs.
  '@kubb/adapter-oas': ^5.18.8
  '@kubb/core': ^5.18.8
  '@kubb/kit': ^5.18.8
  '@kubb/plugin-barrel': ^5.18.8
  '@kubb/renderer-jsx': ^5.18.8
  '@kubb/parser-ts': ^5.18.8
  '@types/node': 22.20.2
  '@types/react': ^19.3.0
  '@vitest/coverage-v8': ^5.1.0
  '@vitest/ui': ^5.1.0
  kubb: ^5.18.8
  oxfmt: ^0.78.0
  oxlint: ^1.93.0
  prettier: ^3.9.10
  tsdown: ^0.23.7
  typescript: ^7.0.2
  vitest: ^5.1.0

# Kubb canary until the release with the store `memo` (kubb-labs/kubb#4612) is out. Remove then and raise the catalog.
overrides:
  '@kubb/adapter-oas': 0.0.0-canary-20261113005743
  '@kubb/ast': 0.0.0-canary-20261113005743
  '@kubb/cli': 0.0.0-canary-20261113005743
  '@kubb/core': 0.0.0-canary-20261113005743
  '@kubb/kit': 0.0.0-canary-20261113005743
  '@kubb/mcp': 0.0.0-canary-20261113005743
  '@kubb/plugin-barrel': 0.0.0-canary-20261113005743
  '@kubb/parser-md': 0.0.0-canary-20261113005743
  '@kubb/parser-ts': 0.0.0-canary-20261113005743
  '@kubb/renderer-jsx': 0.0.0-canary-20261113005743
  '@kubb/studio': 0.0.0-canary-20261113005743
  kubb: 0.0.0-canary-20261113005743
  unplugin-kubb: 0.0.0-canary-20261113005743

