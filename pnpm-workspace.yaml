packages:
  - packages/*
  - internals/*
  - examples/*
  - tests/**

allowBuilds:
  cypress: false
  es5-ext: true
  esbuild: true
  msw: true
  vue-demi: true

catalog:
  # Ranges, not pins: these end up in the published dependencies and peerDependencies of every
  # plugin, and a pin there conflicts with any newer Kubb release the user installs.
  '@kubb/adapter-oas': ^5.0.0
  '@kubb/core': ^5.0.0
  '@kubb/plugin-barrel': ^5.0.0
  '@kubb/parser-ts': ^5.0.0
  '@types/node': ^22.20.1
  '@types/react': ^19.2.18
  '@vitest/coverage-v8': ^4.1.11
  '@vitest/ui': ^4.1.11
  kubb: ^5.0.0
  oxfmt: ^0.64.0
  oxlint: ^1.79.0
  prettier: ^3.9.6
  tsdown: ^0.22.14
  typescript: ^6.0.3
  vitest: ^4.1.11
#
#overrides:
#  '@kubb/adapter-oas': link:../kubb/packages/adapter-oas
#  '@kubb/ast': link:../kubb/packages/ast
#  '@kubb/cli': link:../kubb/packages/cli
#  '@kubb/core': link:../kubb/packages/core
#  '@kubb/kit': link:../kubb/packages/kit
#  '@kubb/mcp': link:../kubb/packages/mcp
#  '@kubb/plugin-barrel': link:../kubb/packages/plugin-barrel
#  '@kubb/parser-md': link:../kubb/packages/parser-md
#  '@kubb/parser-ts': link:../kubb/packages/parser-ts
#  '@kubb/renderer-jsx': link:../kubb/packages/renderer-jsx
#  '@kubb/tui': link:../kubb/packages/tui
#  kubb: link:../kubb/packages/kubb
#  unplugin-kubb: link:../kubb/packages/unplugin-kubb

minimumReleaseAge: 2880 # 48 hours, matches CI's SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS
minimumReleaseAgeExclude:
  - '@kubb/*'
  - 'kubb'
  - 'unplugin-kubb'
  - '@types/*'
  - '@clack/core'
pmOnFail: warn
resolutionMode: highest
