minimumReleaseAge: 2880 # 48 hours, matches CI's SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS
minimumReleaseAgeExclude:
  - '@kubb/*'
  - 'kubb'
  - 'unplugin-kubb'
  - '@types/*'
  - '@clack/core'
pmOnFail: warn
resolutionMode: highest
