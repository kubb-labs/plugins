packages:
  - packages/*
  - internals/*
  - examples/*
  - tests/**

allowBuilds:
  cypress: false
  es5-ext: true
  esbuild: true
  msw: true
  vue-demi: true

catalog:
  # Ranges, not pins: these end up in the published dependencies and peerDependencies of every
  # plugin, and a pin there conflicts with any newer Kubb release the user installs.
  '@kubb/adapter-oas': ^5.12.4
  '@kubb/core': ^5.12.4
  '@kubb/plugin-barrel': ^5.12.4
  '@kubb/parser-ts': ^5.12.4
  '@types/node': 22.20.2
  '@typescript/typescript6': ^6.0.2
  '@types/react': ^19.3.0
  '@vitest/coverage-v8': ^5.0.5
  '@vitest/ui': ^5.0.5
  kubb: ^5.12.4
  oxfmt: ^0.72.0
  oxlint: ^1.88.0
  prettier: ^3.9.10
  tsdown: ^0.23.1
  typescript: ^7.0.2
  vitest: ^5.0.5

#overrides: #  '@kubb/adapter-oas': link:../kubb/packages/adapter-oas

#  '@kubb/ast': link:../kubb/packages/ast
#  '@kubb/cli': link:../kubb/packages/cli
#  '@kubb/core': link:../kubb/packages/core
#  '@kubb/kit': link:../kubb/packages/kit
#  '@kubb/mcp': link:../kubb/packages/mcp
#  '@kubb/plugin-barrel': link:../kubb/packages/plugin-barrel
#  '@kubb/parser-md': link:../kubb/packages/parser-md
#  '@kubb/parser-ts': link:../kubb/packages/parser-ts
#  '@kubb/renderer-jsx': link:../kubb/packages/renderer-jsx
#  '@kubb/studio': link:../kubb/packages/studio
#  '@kubb/tui': link:../kubb/packages/tui
#  kubb: link:../kubb/packages/kubb
#  unplugin-kubb: link:../kubb/packages/unplugin-kubb

minimumReleaseAge: 2880 # 48 hours, matches CI's SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS
minimumReleaseAgeExclude:
  - '@kubb/*'
  - 'kubb'
  - 'unplugin-kubb'
  - '@types/*'
  - '@clack/core'
  # examples/openapi-import needs a TypeScript 7.1 dev build with content mapper support
  - 'typescript@7.1.0-dev.20261022.1'
  - '@typescript/typescript-darwin-arm64@7.1.0-dev.20261022.1'
  - '@typescript/typescript-darwin-x64@7.1.0-dev.20261022.1'
  - '@typescript/typescript-linux-arm@7.1.0-dev.20261022.1'
  - '@typescript/typescript-linux-arm64@7.1.0-dev.20261022.1'
  - '@typescript/typescript-linux-x64@7.1.0-dev.20261022.1'
  - '@typescript/typescript-win32-arm64@7.1.0-dev.20261022.1'
  - '@typescript/typescript-win32-x64@7.1.0-dev.20261022.1'
pmOnFail: warn
resolutionMode: highest
