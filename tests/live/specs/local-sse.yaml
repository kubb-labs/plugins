openapi: 3.2.0
info: { title: Local SSE, version: '1' }
servers: [{ url: 'http://127.0.0.1:0' }]
components:
  schemas:
    MessageDelta:
      type: object
      required: [text]
      properties: { text: { type: string }, index: { type: integer } }
    ChatEvent:
      type: object
      required: [event]
      properties:
        data: { type: string }
        event: { type: string }
        id: { type: string }
        retry: { type: integer }
      oneOf:
        - type: object
          required: [event, data]
          properties:
            event: { type: string, const: message_delta }
            data: { $ref: '#/components/schemas/MessageDelta' }
        - type: object
          required: [event]
          properties:
            event: { type: string, const: ping }
            data: { type: string }
      discriminator: { propertyName: event }
    Tick:
      type: object
      required: [n]
      properties: { n: { type: integer }, text: { type: string } }
paths:
  /chat:
    post:
      operationId: streamChat
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { prompt: { type: string } } } } }
      responses:
        '200':
          description: typed events ending with [DONE]
          content: { text/event-stream: { itemSchema: { $ref: '#/components/schemas/ChatEvent' } } }
        '400':
          description: bad prompt
          content: { application/json: { schema: { type: object, properties: { message: { type: string } } } } }
  /feed:
    get:
      operationId: streamFeed
      parameters:
        - { name: count, in: query, schema: { type: integer } }
        - { name: drop, in: query, schema: { type: integer } }
        - { name: padding, in: query, schema: { type: integer } }
        - { name: Last-Event-ID, in: header, schema: { type: string } }
      responses:
        '200':
          description: payload events with id and retry
          content: { text/event-stream: { itemSchema: { $ref: '#/components/schemas/Tick' } } }
