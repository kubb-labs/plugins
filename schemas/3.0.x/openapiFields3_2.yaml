openapi: 3.2.0
info:
  title: OpenAPI 3.1 and 3.2 fields
  summary: Fields from OpenAPI 3.1 and 3.2 that the plugins read
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
externalDocs:
  url: https://example.com/docs
servers:
  - url: https://api.example.com
    name: production
  - url: https://staging.example.com
    name: staging
tags:
  - name: shop
    summary: Shop
    kind: nav
  - name: orders
    parent: shop
security:
  - apiKey: []
paths:
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      externalDocs:
        url: https://example.com/docs/orders
        description: Order guide
      parameters:
        - name: status
          in: query
          deprecated: true
          schema:
            type: string
          examples:
            open:
              summary: Open orders
              dataValue: open
              serializedValue: status=open
        - name: filter
          in: query
          allowEmptyValue: true
          schema:
            type: string
        - name: session
          in: cookie
          style: cookie
          schema:
            type: string
      responses:
        '2XX':
          summary: The orders
          description: The orders
          headers:
            X-Rate-Limit:
              description: Calls left this hour
              required: true
              example: 100
              schema:
                type: integer
            X-Next-Page:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              examples:
                one:
                  dataValue:
                    - id: 1
                      paymentMethod: card
                      creditCard: '4111'
                      billingAddress: Main St 1
          links:
            getOrder:
              operationId: getOrder
              parameters:
                orderId: $response.body#/0/id
        '4XX':
          description: Client error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: createOrder
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
            example:
              id: 1
              paymentMethod: cash
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Order:
      type: object
      externalDocs:
        url: https://example.com/docs/order
        description: Order model
      minProperties: 1
      maxProperties: 10
      required: [id]
      properties:
        id:
          type: integer
          exclusiveMinimum: 0
        paymentMethod:
          type: string
          enum: [card, cash]
        creditCard:
          type: string
        billingAddress:
          type: string
        labels:
          type: array
          items:
            type: string
          contains:
            $ref: '#/components/schemas/Priority'
          minContains: 1
          maxContains: 2
        metadata:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/Metadata'
      dependentRequired:
        creditCard: [billingAddress]
      if:
        properties:
          paymentMethod:
            const: card
        required: [paymentMethod]
      then:
        required: [creditCard]
    Priority:
      type: string
      const: priority
    Metadata:
      type: object
      properties:
        source:
          type: string
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
